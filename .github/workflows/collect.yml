# Hourly collection trigger
#
# WHY GITHUB ACTIONS AND NOT VERCEL CRON
#
# Vercel's own cron is limited to once per day on the free Hobby plan; hourly
# would need Vercel Pro at $20/month. A GitHub Actions schedule does the same
# job for nothing, so this workflow simply calls the app's own /api/refresh
# endpoint. All the logic lives in the app; this file is a timer.
#
# TWO CAVEATS, BOTH REAL
#
#   1. GitHub schedules are best-effort. Under load a run can be delayed by
#      several minutes, and occasionally skipped. That is fine here: the
#      pipeline is idempotent and conditional requests mean a late run costs
#      nothing extra.
#   2. GitHub DISABLES scheduled workflows in a repository with no activity for
#      60 days. If collection silently stops, check that first.
#
# SETUP (one time)
#
#   Repository → Settings → Secrets and variables → Actions:
#     COLLECT_URL     https://<your-app>.vercel.app/api/refresh
#     COLLECT_SECRET  the same value set in the Vercel environment
#
# Until those exist the workflow exits cleanly with a message rather than
# failing — a red cross on every hourly run trains you to ignore it.

name: Collect developments

on:
  schedule:
    # Every hour, on the hour (UTC).
    - cron: '0 * * * *'
  # Manual trigger, for testing the wiring without waiting for the hour.
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (fetch and deduplicate only, no AI calls, no cost)'
        type: boolean
        default: false
      limit:
        description: 'Max articles processed per source'
        type: string
        default: '5'

# One run at a time. Two overlapping runs would both fetch the same new
# articles, and PGlite aside, duplicated Opus calls are duplicated money.
concurrency:
  group: collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check configuration
        id: check
        env:
          COLLECT_URL: ${{ secrets.COLLECT_URL }}
        run: |
          if [ -z "$COLLECT_URL" ]; then
            echo "COLLECT_URL secret is not set — nothing to call."
            echo "See the comments in this workflow file for setup."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger collection
        if: steps.check.outputs.configured == 'true'
        env:
          COLLECT_URL: ${{ secrets.COLLECT_URL }}
          COLLECT_SECRET: ${{ secrets.COLLECT_SECRET }}
          DRY: ${{ inputs.dry_run && '1' || '0' }}
          LIMIT: ${{ inputs.limit || '5' }}
        run: |
          set -euo pipefail

          echo "Triggering collection (dry=$DRY, limit=$LIMIT)"

          # -sS: quiet but still report errors. --fail-with-body: non-2xx is a
          # failure, but print the body so the reason is in the log rather than
          # just an exit code.
          response=$(curl -sS --fail-with-body \
            --max-time 300 \
            --retry 2 --retry-delay 10 --retry-connrefused \
            -X POST \
            -H "Authorization: Bearer $COLLECT_SECRET" \
            -H "Content-Type: application/json" \
            "$COLLECT_URL?dry=$DRY&limit=$LIMIT")

          echo "$response"

          # Surface the headline numbers in the run summary, so the Actions tab
          # is readable at a glance without opening the log.
          {
            echo "### Collection run"
            echo ""
            echo '```json'
            echo "$response"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
